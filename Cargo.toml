[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
bytes = "1.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
