[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
agent-client = { path = "client" }
bytes = "1.11"
dhat = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "process", "fs", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[features]
# Heap profiling: build with --features heap-profile and debug info kept
# (CARGO_PROFILE_RELEASE_STRIP=none CARGO_PROFILE_RELEASE_DEBUG=1); set
# AGENT_HEAP_PROFILE=path to write a dhat JSON profile at exit.
heap-profile = ["dep:dhat"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[workspace]
members = ["client", "tui", "app/src-tauri"]
