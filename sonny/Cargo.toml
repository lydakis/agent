[package]
name = "sonny"
version = "0.7.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

# Sonny: a terminal client for the daemon, beside the app, that lays its
# work out in Rex. Prototype.

[dependencies]
agent-client = { path = "../client" }
# Already built for the runtime; encodes program status titles (OSC 7501).
base64 = "0.23"
# Splits the browser tool's command lines as a shell would, running none.
shell-words = "1"
# Reads the browser tool's URLs as the browser does (WHATWG), already
# built for reqwest.
url = "2"
# Scroll regions write history rows without padding them to the width, so
# a pane that narrows later does not re-wrap them.
# Asks the terminal for its background (theme.rs).
libc = "0.2"
# Opens links, files and pages with the desktop's opener, whichever is
# installed (xdg-open, gio, wslview, ...).
open = "5"
# The lookout asks its decision model over HTTPS (lookout.rs).
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
ratatui = { version = "0.30", features = ["scrolling-regions"] }
# Syntax colors for code, as bat draws them: syntect with bat's own
# syntaxes and themes, read with Oniguruma as bat reads them: about three
# times faster than the pure-Rust regex engine on code-heavy history.
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
# A side chat in the pane beside the conversation: its Sonny runs on a
# terminal of its own, whose screen is read as a terminal would draw it.
portable-pty = "0.9"
vt100 = "0.18"
resvg = "0.45"
# Picture files in the pane and in Markdown, as the runtime reads them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The MCP servers the lookout keeps for agents' scripts: the official Rust
# SDK, which Codex uses too, as a client over stdio and streamable HTTP.
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
# Runs agents' `exec` scripts: QuickJS, as Pi's code mode does, small
# beside V8, with a memory limit and an interrupt for a script's time.
rquickjs = { version = "0.14", features = ["futures", "disable-assertions"] }
serde_json = "1"
# Digests an MCP server's config, secrets and all, for its listing's cache.
sha2 = "0.10"
# Checks an edited project file before it replaces the person's, as the
# client reads it.
toml = "0.9"
# Line and word diffs for edits, as Codex's TUI uses it.
similar = { version = "2", features = ["inline"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "signal"] }
# Moves the cursor and wraps by what the terminal draws as one character.
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
# A stand-in daemon on a Unix socket, for the event handling's tests.
tokio = { version = "1", features = ["net", "io-util"] }

[lints]
workspace = true
