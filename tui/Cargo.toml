[package]
name = "agent-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

# A terminal client for the agent daemon. It speaks the daemon's socket
# protocol only; it does not link the runtime, so the core's dependency set
# and build are untouched.

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[dependencies]
agent-client = { path = "../client" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
serde_json = "1"
terminal-colorsaurus = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
