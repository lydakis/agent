name: Test

# The gate on every pull request and on main. One job runs the Rust tests
# and lints; another builds the daemon and Sonny for release and runs the
# runtime suite (AGENT_TEST_RUNTIME=1) against those binaries: a real daemon
# driven by scripted models through replay, restart and recovery, steering,
# compaction, forks, approvals, triggers and the lookout. The macos job runs
# the Rust tests where the release is built, so a failure only macOS has
# shows on the pull request instead of at release. No provider key is used
# and nothing is spent. The jobs run side by side.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # Sandbox tests fail here, rather than skip, when no sandbox runs.
      AGENT_TEST_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: |
          # Sandboxed commands run in bubblewrap.
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 keeps the unprivileged user namespaces bubblewrap
          # needs behind AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo test --locked --workspace
      - name: Release script tests
        run: python3 -m unittest discover -s release

  macos:
    # The release's package job runs these same tests on this runner before
    # it builds anything.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Release script tests
        run: python3 -m unittest discover -s release

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # Sandbox tests fail here, rather than skip, when no sandbox runs.
      AGENT_TEST_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the daemon and Sonny
        # The suite runs the release binaries in .local/target/release.
        run: cargo build --release --locked --workspace --bins
      - name: Install bubblewrap
        # Sandboxed commands run in it; see the rust job for the sysctl.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Runtime tests
        env:
          AGENT_TEST_RUNTIME: "1"
        run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --quiet -r bench/requirements.txt
          # Modules mostly wait on scripted models, so four at once take a
          # third of the time of one after another. More than that starved
          # timing-sensitive tests in local runs.
          .local/venv/bin/python -m tests.run --jobs 4
