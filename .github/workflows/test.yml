name: Test

# The gate on every pull request and on main. One job runs the Rust tests
# and lints; the other builds the daemon and Sonny for release and runs the
# runtime suite (AGENT_TEST_RUNTIME=1) against those binaries: a real daemon
# driven by scripted models through replay, restart and recovery, steering,
# compaction, forks, approvals, triggers and the lookout. No provider key is
# used and nothing is spent. The jobs run side by side.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: |
          # Sonny's SandFS task copies mount through FUSE.
          sudo apt-get update
          sudo apt-get install -y fuse3
          cargo test --locked --workspace
      - name: Release script tests
        run: python3 -m unittest discover -s release

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the daemon and Sonny
        # The suite runs the release binaries in .local/target/release.
        run: cargo build --release --locked --workspace --bins
      - name: Runtime tests
        env:
          AGENT_TEST_RUNTIME: "1"
        run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --quiet -r bench/requirements.txt
          # Modules mostly wait on scripted models, so four at once take a
          # third of the time of one after another. More than that starved
          # timing-sensitive tests in local runs.
          .local/venv/bin/python -m tests.run --jobs 4
