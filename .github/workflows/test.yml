name: Test

# The gate on every pull request and on main. One job runs the Rust tests
# and lints; another builds the daemon and Sonny for release and runs the
# runtime suite (AGENT_TEST_RUNTIME=1) against those binaries: a real daemon
# driven by scripted models through replay, restart and recovery, steering,
# compaction, forks, approvals, triggers and the lookout. The macos job runs
# the Rust tests where the release is built, so a failure only macOS has
# shows on the pull request instead of at release, and the musl job builds
# the static Linux binaries the release ships. No provider key is used
# and nothing is spent. The jobs run side by side.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # Sandbox tests fail here, rather than skip, when no sandbox runs.
      AGENT_TEST_SANDBOX: "1"
      # And the push over ssh through a sandbox, when sshd is missing.
      AGENT_TEST_SSH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: |
          # Sandboxed commands run in bubblewrap; a test pushes over ssh
          # through one, to an sshd of its own.
          # A mirror outage is retried rather than skipping the tests.
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y bubblewrap openssh-server openssh-client && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 30))
          done
          # Ubuntu 24.04 keeps the unprivileged user namespaces bubblewrap
          # needs behind AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          cargo test --locked --workspace
      - name: Release script tests
        # store_down.py unpacks packed messages with Python 3.14's zstd or
        # the zstandard module; the runner's Python has neither.
        run: |
          python3 -m venv .local/release-venv
          .local/release-venv/bin/pip install --quiet zstandard==0.25.0
          .local/release-venv/bin/python -m unittest discover -s release

  macos:
    # The release's package job runs these same tests on this runner before
    # it builds anything, so a failure here fails the run as it would fail
    # the release.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Release script tests
        # store_down.py unpacks packed messages with Python 3.14's zstd or
        # the zstandard module; the runner's Python has neither.
        run: |
          python3 -m venv .local/release-venv
          .local/release-venv/bin/pip install --quiet zstandard==0.25.0
          .local/release-venv/bin/python -m unittest discover -s release

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # Sandbox tests fail here, rather than skip, when no sandbox runs.
      AGENT_TEST_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the daemon and Sonny
        # The suite runs the release binaries in .local/target/release.
        run: cargo build --release --locked --workspace --bins
      - name: Install bubblewrap
        # Sandboxed commands run in it; see the rust job for the sysctl.
        run: |
          # A mirror outage is retried rather than skipping the tests.
          for attempt in 1 2 3 4 5; do
            sudo apt-get update && sudo apt-get install -y bubblewrap && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 30))
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Runtime tests
        env:
          AGENT_TEST_RUNTIME: "1"
          # tests/test_release_stores.py fetches the releases it takes
          # stores back to here.
          AGENT_RELEASE_BINARIES: ${{ github.workspace }}/.local/releases
        run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --quiet -r bench/requirements.txt
          # Modules mostly wait on scripted models, so four at once take a
          # third of the time of one after another. More than that starved
          # timing-sensitive tests in local runs.
          .local/venv/bin/python -m tests.run --jobs 4

  musl:
    # The static Linux builds the release makes, on the same runners and
    # with the same compiler, so a target only the release builds (the
    # aarch64 jemalloc build that failed v0.10.2's first run) fails here on
    # the pull request instead of at the tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig, as Codex's musl builds do
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Set up the musl C toolchain
        env:
          TARGET: ${{ matrix.arch }}-unknown-linux-musl
        run: bash .github/scripts/musl-build-tools.sh
      - name: Build Sonny and the daemon for Linux, as the release does
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          target="${ARCH}-unknown-linux-musl"
          rustup target add "$target"
          cargo build --release --locked --bin agent --target "$target"
          cargo build --release --locked -p sonny --bin sonny --target "$target"
          for binary in sonny agent; do
            file ".local/target/$target/release/$binary" | grep -q 'static'
            # Starts, so its allocator works on this architecture.
            ".local/target/$target/release/$binary" --version
          done
