name: Publish Homebrew

# Publishing a release starts release-request.yml, and this runs after it
# from main's definition, so a tag's own commit never reaches the tap token.
# Re-run a failed publication from this workflow's run.

on:
  workflow_run:
    workflows: ["Release request"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  publish:
    # Prereleases (vX.Y.Z-...) stay off the tap; the tap update also checks
    # the release is published and stable.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release' &&
      !contains(github.event.workflow_run.head_branch, '-')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run main's scripts, never the tag's.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve approved release
        id: release
        env:
          # A release's run names its tag as its head branch.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable tag such as v0.1.0' >&2
            exit 1
          fi
          # Resolve once, before executing any code from the selected tag. A
          # draft's tag can be moved before it is published.
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          approved_main=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          if ! git merge-base --is-ancestor "$commit" "$approved_main"; then
            echo 'Release tag must point to a commit on main' >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out release validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Validate with the same generator that built the release assets.
          ref: ${{ steps.release.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api "repos/lydakis/agent/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          gh release download "$RELEASE_TAG" --repo lydakis/agent \
            --pattern checksums.txt --pattern source-commit.txt \
            --pattern "agent-${RELEASE_TAG#v}.tar.gz" --pattern agent-formula.rb \
            --pattern sonny-formula.rb --dir "$RUNNER_TEMP/release"
      - name: Verify the assets were built by the release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/release"
          for asset in "agent-${RELEASE_TAG#v}.tar.gz" agent-formula.rb sonny-formula.rb \
            source-commit.txt; do
            gh attestation verify "$asset" --repo lydakis/agent \
              --signer-workflow lydakis/agent/.github/workflows/release.yml \
              --deny-self-hosted-runners
          done
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lydakis/homebrew-agent
          ref: main
          path: tap
          persist-credentials: false
      - name: Verify release and prepare update
        id: prepare
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          for name in agent sonny; do
            python3 release/prepare_homebrew_update.py --kind "$name" "$RELEASE_TAG" \
              "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release" \
              "tap/Formula/$name.rb" "$RUNNER_TEMP/tap-$name.json" \
              --commit "$RELEASE_COMMIT" \
              --generator release-source/release/homebrew_formula.py
            if [ -f "$RUNNER_TEMP/tap-$name.json" ]; then
              echo 'formula_changed=true' >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Check publication credential is configured
        if: steps.prepare.outputs.formula_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set HOMEBREW_TAP_GITHUB_TOKEN with Contents write access to lydakis/homebrew-agent.' >&2
            exit 1
          fi
      - name: Validate formulas and installation
        if: steps.prepare.outputs.formula_changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tap_parent="$(brew --repository)/Library/Taps/lydakis"
          mkdir -p "$tap_parent"
          ln -sfn "$GITHUB_WORKSPACE/tap" "$tap_parent/homebrew-agent"
          for name in agent sonny; do
            ruby -c "tap/Formula/$name.rb"
            brew style "lydakis/agent/$name"
            brew audit --formula --strict --online "lydakis/agent/$name"
          done
          # Sonny pulls in the daemon, and both build from source here as
          # they will on the person's machine.
          brew install --formula lydakis/agent/sonny
          brew test lydakis/agent/agent lydakis/agent/sonny
          brew uninstall --formula lydakis/agent/sonny lydakis/agent/agent
      - name: Publish validated formulas
        if: steps.prepare.outputs.formula_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          # The daemon first: Sonny's formula depends on it.
          for name in agent sonny; do
            if [ -f "$RUNNER_TEMP/tap-$name.json" ]; then
              gh api --method PUT "repos/lydakis/homebrew-agent/contents/Formula/$name.rb" \
                --input "$RUNNER_TEMP/tap-$name.json" --jq .commit.html_url
            fi
          done
