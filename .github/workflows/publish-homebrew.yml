name: Publish Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Already published stable release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event's own ref is its tag: run main's scripts, not the tag's.
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve approved release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected a stable tag such as v0.1.0' >&2
            exit 1
          fi
          # Resolve once, before executing any code from the selected tag. A
          # draft's tag can be moved before it is published.
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          approved_main=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          if ! git merge-base --is-ancestor "$commit" "$approved_main"; then
            echo 'Release tag must point to a commit on main' >&2
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out release validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Validate with the same generator that built the release assets.
          ref: ${{ steps.release.outputs.commit }}
          path: release-source
          persist-credentials: false
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api "repos/lydakis/agent/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          gh release download "$RELEASE_TAG" --repo lydakis/agent \
            --pattern agent.rb --pattern checksums.txt --pattern source-commit.txt \
            --pattern "Agent_${RELEASE_TAG#v}_universal.zip" --dir "$RUNNER_TEMP/release"
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lydakis/homebrew-agent
          ref: main
          path: tap
          persist-credentials: false
      - name: Verify release and prepare update
        id: prepare
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          python3 app/release/prepare_homebrew_update.py "$RELEASE_TAG" \
            "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release" \
            tap/Casks/agent.rb "$RUNNER_TEMP/tap-update.json" \
            --commit "$RELEASE_COMMIT" \
            --generator release-source/app/release/homebrew_cask.py
          if [ -f "$RUNNER_TEMP/tap-update.json" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check publication credential is configured
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set HOMEBREW_TAP_GITHUB_TOKEN with Contents write access to lydakis/homebrew-agent.' >&2
            exit 1
          fi
      - name: Validate cask and installation
        if: steps.prepare.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          ruby -c tap/Casks/agent.rb
          tap_parent="$(brew --repository)/Library/Taps/lydakis"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE/tap" "$tap_parent/homebrew-agent"
          brew style lydakis/agent/agent
          brew audit --cask --strict --online lydakis/agent/agent
          brew install --cask lydakis/agent/agent
          app=/Applications/Agent.app
          spctl --assess --type execute --verbose=2 "$app"
          test "$("$app/Contents/MacOS/agent" --version)" = "agent-runtime ${RELEASE_TAG#v}"
          brew uninstall --cask lydakis/agent/agent
          test ! -e "$app"
      - name: Publish validated cask
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          gh api --method PUT repos/lydakis/homebrew-agent/contents/Casks/agent.rb \
            --input "$RUNNER_TEMP/tap-update.json" --jq .commit.html_url
