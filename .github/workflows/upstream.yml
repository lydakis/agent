name: Upstream

# Each week, the latest agent-browser and agent-desktop against Sonny's
# browser and desktop tools, which pass only the commands and flags they
# list. Two things are found. What a release documents that
# sonny/upstream/<program>.txt does not is new: it opens an issue naming
# each new command and flag with its help, and the job stays green, since
# the tools refuse what they do not list. Supporting it, or deciding not
# to, and refreshing the list with sonny/upstream/inventory.py, with the
# version and integrity Sonny installs pinned to match in
# sonny/src/trusted.rs, closes it.
# A command or flag the tools pass that the release no longer documents,
# or a line agent-desktop's own parser no longer takes, is breakage: the
# job fails and opens an issue. And the programs Sonny pins must still
# install from npm and run, on Linux x64 and ARM alike, or the job fails.
# It runs on its own, so none of this blocks a pull request.

on:
  schedule:
    # Saturdays, so what a week's releases changed is known before Monday.
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream
  cancel-in-progress: true

jobs:
  check:
    # On both Linux machines Sonny runs on: a release can drop or break one
    # architecture's program alone. One after the other, so the second
    # finds the issues the first opened and opens none again.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest releases
        # Without their install scripts, which fetch or link nothing the
        # check needs; their native programs are what it runs. npm names
        # the architecture as their packages do (x64, arm64).
        # agent-browser's is in the package npm installs for this machine
        # beside it (@agent-browser/cli-linux-ARCH-gnu, from 0.43.0);
        # agent-desktop's in its own bin/.
        run: |
          mkdir -p .local/upstream
          npm install --prefix .local/upstream --no-save --ignore-scripts agent-browser@latest agent-desktop@latest
          modules="$PWD/.local/upstream/node_modules"
          arch=$(node -p process.arch)
          browser="$modules/@agent-browser/cli-linux-$arch-gnu/bin/agent-browser"
          desktop="$modules/agent-desktop/bin/agent-desktop-linux-$arch"
          chmod +x "$browser" "$desktop"
          echo "BROWSER_PROGRAM=$browser" >> "$GITHUB_ENV"
          echo "DESKTOP_PROGRAM=$desktop" >> "$GITHUB_ENV"
          echo "MACHINE=linux-$arch" >> "$GITHUB_ENV"
      - name: List what they document
        run: |
          python3 sonny/upstream/inventory.py list agent-browser "$BROWSER_PROGRAM" > .local/upstream/agent-browser.txt
          python3 sonny/upstream/inventory.py list agent-desktop "$DESKTOP_PROGRAM" > .local/upstream/agent-desktop.txt
          head -1 .local/upstream/*.txt
      - name: Open an issue for what is new
        run: |
          # Read whole first: grep stopping early would fail the pipe.
          opened=$(gh issue list --state all --limit 500 --json title --jq '.[].title')
          for program in agent-browser agent-desktop; do
            case $program in
              agent-browser) native=$BROWSER_PROGRAM ;;
              agent-desktop) native=$DESKTOP_PROGRAM ;;
            esac
            news=".local/upstream/$program.md"
            python3 sonny/upstream/inventory.py news "$program" "$native" "sonny/upstream/$program.txt" > "$news"
            [ -s "$news" ] || continue
            title="$("$native" --version) documents commands or flags Sonny's tools do not list"
            if grep -Fxq "$title" <<< "$opened"; then
              echo "$title: opened before"
              continue
            fi
            {
              cat "$news"
              echo
              echo "Sonny's tool refuses each of these until it lists it. Add those agents should have to its lists in \`sonny/src/\` (or decide not to), then refresh \`sonny/upstream/$program.txt\` with \`python3 sonny/upstream/inventory.py list $program <native program>\` and move its pin in \`sonny/src/trusted.rs\` to that version and its npm integrity in the same pull request, which closes this. Run this workflow on that branch: it installs the pins on Linux x64 and ARM."
              echo
              echo "Found on $MACHINE by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            } > "$news.issue"
            if [ "$program" = agent-browser ]; then
              # Its pin is older than the layout it publishes now.
              echo >> "$news.issue"
              echo "From 0.43.0 agent-browser publishes each platform's program in a package of its own, \`@agent-browser/cli-PLATFORM\` (\`-gnu\` on Linux), holding \`bin/agent-browser\`, and none in its own tarball. Sonny's installer in \`sonny/src/trusted.rs\` fetches the program from agent-browser's own tarball, so moving the pin past 0.42 means it fetching this platform's package, against an integrity pinned for each platform." >> "$news.issue"
            fi
            gh issue create --title "$title" --body-file "$news.issue"
          done
      - name: Check what the tools pass is still there
        id: tools
        run: |
          # The tests run in sonny/, so the inventories are named whole.
          AGENT_BROWSER_INVENTORY="$PWD/.local/upstream/agent-browser.txt" \
          AGENT_DESKTOP_INVENTORY="$PWD/.local/upstream/agent-desktop.txt" \
          AGENT_DESKTOP_PARSES="$DESKTOP_PROGRAM" \
            cargo test --locked -p sonny -- \
              agent_browser_documents_what_the_tool_passes \
              agent_desktop_has_what_the_tool_passes \
              agent_desktop_parses_what_the_tool_passes 2>&1 | tee .local/upstream/tools.log
      - name: Open an issue for what broke
        if: failure() && steps.tools.outcome == 'failure'
        run: |
          title="$("$BROWSER_PROGRAM" --version) or $("$DESKTOP_PROGRAM" --version) drops what Sonny's tools pass"
          open=$(gh issue list --state open --limit 500 --json title --jq '.[].title')
          if grep -Fxq "$title" <<< "$open"; then
            echo "$title: open already"
            exit 0
          fi
          {
            echo "A command or flag Sonny's browser or desktop tool passes is no longer documented, or a line it passes no longer parses. Agents get an error for it until the tool's lists in \`sonny/src/\` follow the release."
            echo
            echo '```'
            # A log with neither phrase (a build that failed, say) still
            # opens the issue: grep finding nothing must not end the step.
            { grep -A 20 "no longer\|panicked" .local/upstream/tools.log || true; } | head -60
            echo '```'
            echo
            echo "Found on $MACHINE by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > .local/upstream/broke.md
          gh issue create --title "$title" --body-file .local/upstream/broke.md
      - name: Check Sonny's pinned programs install and run here
        # What `sonny setup` and `sonny upgrade` install on this machine,
        # from npm, at the versions sonny/src/trusted.rs pins. Checked
        # whatever the steps before found, so a pin that no longer
        # installs on one architecture shows.
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sonny -- --ignored the_pinned_programs_install_from_npm_and_run_here
