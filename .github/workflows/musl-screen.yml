name: Musl screen (temporary)

# One-off for #1194: the Perf workflow's screen on the static musl builds,
# head (Zig's clang, jemalloc on both arches) against main (musl-gcc). Removed
# before merge.

on:
  pull_request:
    paths:
      - ".github/workflows/musl-screen.yml"

permissions:
  contents: read

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build main as its release does (musl-gcc)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
          git worktree add -q .local/base "$BASE"
          cd .local/base
          export "CC_${TARGET//-/_}=musl-gcc"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.local/target-base"
          cargo build --release --locked --bin agent --target "$TARGET"
          cargo build --release --locked -p sonny --bin sonny --target "$TARGET"
          mkdir -p "$GITHUB_WORKSPACE/.local/perf/base"
          cp "$CARGO_TARGET_DIR/$TARGET/release/agent" "$CARGO_TARGET_DIR/$TARGET/release/sonny" "$GITHUB_WORKSPACE/.local/perf/base/"
          cp "$CARGO_TARGET_DIR/$TARGET/release/agent" "$GITHUB_WORKSPACE/.local/perf/agent-base"
      - name: Install Zig, as Codex's musl builds do
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Set up the musl C toolchain
        run: bash .github/scripts/musl-build-tools.sh
      - name: Build the pull request as the release will
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.local/target-head"
          cargo build --release --locked --bin agent --target "$TARGET"
          cargo build --release --locked -p sonny --bin sonny --target "$TARGET"
          mkdir -p .local/perf/head
          cp "$CARGO_TARGET_DIR/$TARGET/release/agent" "$CARGO_TARGET_DIR/$TARGET/release/sonny" .local/perf/head/
          cp "$CARGO_TARGET_DIR/$TARGET/release/agent" .local/perf/agent-head
          for side in base head; do
            file .local/perf/$side/agent .local/perf/$side/sonny
            strings .local/perf/$side/agent | grep -c 'narenas_ratio:0.25' || true
          done
      - name: Screen both, alternately
        run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --quiet -r bench/requirements.txt
          py=.local/venv/bin/python
          for round in 1 2; do
            for side in base head; do
              bin=.local/perf/agent-$side
              $py -m bench.admission_burst --binary $bin --repeat 5 --out .local/perf/admission-$side-$round
              $py -m bench.completion_burst --binary $bin --repeat 5 --out .local/perf/completion-$side-$round
              $py -m bench.footprint --binary $bin --repeat 2 --out .local/perf/footprint-$side-$round
              $py -m bench.lifecycle --binary $bin --transport socket --agents 32 --mode echo \
                --tools echo,shell,read,write,edit --repeat 1 --out .local/perf/lifecycle-$side-$round
              $py -m bench.sonny_screen --agent .local/perf/$side/agent --sonny .local/perf/$side/sonny \
                --out .local/perf/sonny-$side-$round
            done
          done
      - name: Compare
        run: .local/venv/bin/python -m bench.perf_gate .local/perf | tee .local/perf/compare.txt
