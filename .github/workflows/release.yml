name: Release

# Packages a version tag's source and its Homebrew formulas, and static Linux
# builds of Sonny and its daemon, as a draft release. Publishing the draft is
# the human step; publish-homebrew.yml then updates the tap. A tag push
# starts release-request.yml, and this runs after it from main's definition,
# so a tag's own commit never reaches the release's write token. Re-run a
# failed release from this workflow's run.

on:
  workflow_run:
    workflows: ["Release request"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        env:
          # A tag push's run names the tag as its head branch.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a tag such as v0.1.0 or v0.1.0-rc.1' >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve approved release
        id: source
        env:
          # A tag push's run names the tag as its head branch.
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Resolve once, before executing any code from the selected tag.
          commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          approved_main=$(git rev-parse --verify "refs/remotes/origin/main^{commit}")
          if ! git merge-base --is-ancestor "$commit" "$approved_main"; then
            echo 'Release tag must point to a commit on main' >&2
            exit 1
          fi
          # `agent --version` takes the runtime's version and `sonny
          # --version` Sonny's; both must be the tag's.
          for manifest in Cargo.toml sonny/Cargo.toml; do
            version=$(git show "$commit:$manifest" | python3 -c \
              'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')
            if [ "v$version" != "$RELEASE_TAG" ]; then
              echo "$manifest has version $version, not ${RELEASE_TAG#v}" >&2
              exit 1
            fi
          done
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    # Triggers run on launchd, so the tests run where they do.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release checkout
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo 'Release checkout does not match the approved commit' >&2
            exit 1
          fi
          if [ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "$RELEASE_COMMIT" ]; then
            echo 'Release tag changed after approval' >&2
            exit 1
          fi
      - name: Test
        run: |
          python3 -m unittest discover -s release
          cargo test --locked --workspace
      - name: Package the source and formulas, and verify them
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir dist
          # The formulas for the daemon and Sonny build both from this
          # commit's source on the person's machine; nothing in it is signed.
          git archive --format=tar.gz --prefix="agent-${version}/" \
            -o "dist/agent-${version}.tar.gz" "$RELEASE_COMMIT"
          tar -tzf "dist/agent-${version}.tar.gz" > "$RUNNER_TEMP/source.txt"
          for file in Cargo.toml Cargo.lock sonny/Cargo.toml; do
            grep -qx "agent-${version}/$file" "$RUNNER_TEMP/source.txt"
          done
          for name in agent sonny; do
            python3 release/homebrew_formula.py "$name" "$version" \
              "dist/agent-${version}.tar.gz" "dist/${name}-formula.rb"
            ruby -c "dist/${name}-formula.rb"
          done
          # Publishing checks the tag still resolves to the commit built here.
          printf '%s\n' "$RELEASE_COMMIT" > dist/source-commit.txt
          cd dist
          shasum -a 256 "agent-${version}.tar.gz" agent-formula.rb sonny-formula.rb \
            source-commit.txt > checksums.txt
          shasum -a 256 --check checksums.txt
      - name: Attest the release assets
        # Publishing verifies this: assets swapped on the draft afterwards,
        # checksums and all, carry no attestation from this workflow.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/agent-*.tar.gz
            dist/agent-formula.rb
            dist/sonny-formula.rb
            dist/source-commit.txt
      - name: Verify release tag before publishing
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          remote_refs=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          remote_commit=$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled = $1 }
            $2 !~ /\^\{\}$/ { direct = $1 }
            END { print (peeled != "" ? peeled : direct) }')
          if [ "$remote_commit" != "$RELEASE_COMMIT" ]; then
            echo 'Release tag changed during the build' >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/agent-*.tar.gz dist/checksums.txt \
            dist/agent-formula.rb dist/sonny-formula.rb dist/source-commit.txt \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes "${options[@]}"

  linux:
    # Static Linux builds of Sonny and its daemon, added to the draft the
    # package job made. Nothing here is signed.
    needs: [resolve, package]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Linux release checkout
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]; then
            echo 'Release checkout does not match the approved commit' >&2
            exit 1
          fi
          if [ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "$RELEASE_COMMIT" ]; then
            echo 'Release tag changed after approval' >&2
            exit 1
          fi
      - name: Build Sonny and the daemon for Linux
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Linked against musl, statically, so they run on any Linux of
          # their architecture.
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target="${ARCH}-unknown-linux-musl"
          rustup target add "$target"
          export "CC_${ARCH}_unknown_linux_musl=musl-gcc"
          cargo build --release --locked --bin agent --target "$target"
          # On its own, as on the Mac, so shared features leave the daemon as built.
          cargo build --release --locked -p sonny --bin sonny --target "$target"
      - name: Package Sonny for Linux and verify it
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          # The formula's layout: Sonny finds the daemon in libexec beside it.
          version="${RELEASE_TAG#v}"
          target="${ARCH}-unknown-linux-musl"
          name="sonny-${version}-linux-${ARCH}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/bin" "$stage/libexec" dist
          cp ".local/target/$target/release/sonny" "$stage/bin/sonny"
          cp ".local/target/$target/release/agent" "$stage/libexec/agent"
          for binary in "$stage/bin/sonny" "$stage/libexec/agent"; do
            file "$binary" | grep -q 'static'
          done
          test "$("$stage/bin/sonny" --version)" = "sonny ${version}"
          test "$("$stage/libexec/agent" --version)" = "agent-runtime ${version}"
          tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
          cd dist
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          sha256sum --check "$name.tar.gz.sha256"
      - name: Attest the Linux assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sonny-*-linux-*.tar.gz
      - name: Verify release tag before adding to the draft
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          remote_refs=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          remote_commit=$(printf '%s\n' "$remote_refs" | awk '
            $2 ~ /\^\{\}$/ { peeled = $1 }
            $2 !~ /\^\{\}$/ { direct = $1 }
            END { print (peeled != "" ? peeled : direct) }')
          if [ "$remote_commit" != "$RELEASE_COMMIT" ]; then
            echo 'Release tag changed during the build' >&2
            exit 1
          fi
      - name: Add the Linux assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/sonny-*-linux-*.tar.gz dist/sonny-*-linux-*.tar.gz.sha256
