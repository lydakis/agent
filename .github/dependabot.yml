# Dependabot version updates. Security updates and alerts are repository
# settings, not this file; this adds the weekly version pull requests.
# Cargo dependencies are grouped into one pull request a week so a run of
# patch bumps does not become a run of Perf screens; a major bump of a
# dependency gets its own. The pinned action SHAs in workflows are bumped
# with their version comments.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # The same three days .cargo/config.toml asks of Cargo.
    cooldown:
      default-days: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Only the vendored crossterm uses parking_lot directly, and it stays
      # on what crossterm 0.29 was published with (vendor/crossterm/README.md).
      # Other crates keep 0.12, so 0.13 would add a second copy, not replace
      # one. parking_lot moves when crossterm does.
      - dependency-name: parking_lot
        versions: [">= 0.13"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
