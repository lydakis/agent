[build]
target-dir = ".local/target"

# Resolve only crate versions published at least three days ago, so a
# hijacked release is usually yanked before an update can pick it up.
# `cargo install` and locked builds are unaffected.
[registry]
global-min-publish-age = "3 days"

# jemalloc's defaults in the static Linux builds, as Codex sets them
# (codex-rs/.cargo/config.toml): one arena per four CPUs keeps idle memory
# low.
[env]
JEMALLOC_SYS_WITH_MALLOC_CONF = "narenas_ratio:0.25"
