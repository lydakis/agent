<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="frame-src about:; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:; object-src 'none'">
<title>Agent</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div class="pane sidebar">
    <div class="pane-title"><span>projects</span><button type="button" class="ibtn" data-act="settings" title="Settings (⌘,)" aria-label="Settings">⚙</button></div>
    <div class="scroll" id="bots"></div>
    <button type="button" class="newproj" id="newproj" data-act="new-project">＋ New project</button>
    <form class="newproj" id="projform" hidden><span>＋</span><input id="projdir" autocomplete="off" spellcheck="false" aria-label="Project folder" placeholder="folder"><div class="pm" id="projmodel"></div></form>
  </div>
  <div class="pane main">
    <div class="phead" id="title"></div>
    <div class="scroll" id="log"></div>
    <form class="composer" id="form">
      <div class="cbox"><textarea id="input" rows="1" autocomplete="off" spellcheck="false" aria-label="Message"></textarea><div class="cacts"><button type="button" class="mchip" id="model" data-act="model" data-pane="main" title="Model" hidden></button><button type="button" class="cbtn stop" id="stop" data-act="stop-pane" data-pane="main" title="Stop" aria-label="Stop" hidden>■</button><span class="split"><button type="submit" class="cbtn send" id="send">Send</button><button type="button" class="cbtn send caret" data-act="sendmenu" data-pane="main" title="Queue, steer or side chat" aria-label="Ways to send">▾</button></span></div></div>
    </form>
  </div>
  <div class="pane side">
    <div class="phead" id="sidetitle"></div>
    <div class="scroll" id="side"></div>
    <form class="composer" id="sideform">
      <div class="cbox"><textarea id="sideinput" rows="1" autocomplete="off" spellcheck="false" aria-label="Message beside"></textarea><div class="cacts"><button type="button" class="mchip" id="sidemodel" data-act="model" data-pane="side" title="Model" hidden></button><button type="button" class="cbtn stop" id="sidestop" data-act="stop-pane" data-pane="side" title="Stop" aria-label="Stop" hidden>■</button><span class="split"><button type="submit" class="cbtn send" id="sidesend">Send</button><button type="button" class="cbtn send caret" data-act="sendmenu" data-pane="side" title="Queue, steer or side chat" aria-label="Ways to send">▾</button></span></div></div>
    </form>
  </div>
  <div class="keybar" id="keybar"></div>
</div>
<div class="menu" id="menu" role="menu"></div>
<div class="overlay" id="pickerwrap"><div class="picker"><div class="q"><span>›</span><input id="pickerq" placeholder="find a bot…" aria-label="Filter bots"></div><div class="list" id="pickerlist"></div></div></div>
<div class="overlay" id="sheetwrap"><form class="sheet" id="sheet" autocomplete="off"></form></div>
<div class="overlay" id="helpwrap"><div class="helpbox" id="helptext"></div></div>
<div class="detached" id="detached"></div>
<div class="setupwrap" id="setupwrap"><div class="setup" id="setup"></div></div>
<script src="daemon.js"></script>
<script src="vendor/marked.js"></script>
<script src="rich.js"></script>
<script src="app.js"></script>
</body>
</html>
