<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <div class="pane rail"><div class="pane-title">bots</div><div class="scroll" id="bots"></div></div>
  <div class="pane main"><div class="pane-title" id="title"></div><div class="scroll" id="log"></div></div>
  <div class="pane peekpane"><div class="pane-title" id="peektitle"></div><div class="scroll" id="peek"></div></div>
  <form class="prompt" id="form"><span class="who" id="who">›</span><input id="input" autocomplete="off" spellcheck="false" aria-label="Prompt"></form>
  <div class="keybar" id="keybar"></div>
</div>
<div class="overlay" id="pickerwrap"><div class="picker"><div class="q"><span>›</span><input id="pickerq" placeholder="switch to…" aria-label="Filter bots"></div><div class="list" id="pickerlist"></div></div></div>
<div class="overlay" id="helpwrap"><div class="helpbox" id="helptext"></div></div>
<div class="detached" id="detached"></div>
<script src="daemon.js"></script>
<script src="app.js"></script>
</body>
</html>
